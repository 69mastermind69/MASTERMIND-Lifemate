
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19131b"/>
      <stop offset="55%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#250711"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff426b"/>
      <stop offset="45%" stop-color="#e10e3d"/>
      <stop offset="100%" stop-color="#710019"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2f5"/>
      <stop offset="50%" stop-color="#b8a7b3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="aura">
      <stop offset="0%" stop-color="#c90038" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#c90038" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="110" fill="url(#background)"/>
  <circle cx="256" cy="245" r="205" fill="url(#aura)"/>

  <!-- Gothic frame -->
  <path d="M256 38 L430 115 L454 256 L410 392
           L256 474 L102 392 L58 256 L82 115 Z"
        fill="none" stroke="#692039" stroke-width="2" opacity=".8"/>

  <path d="M256 56 L412 126 L432 256 L393 375
           L256 448 L119 375 L80 256 L100 126 Z"
        fill="none" stroke="#c32a51" stroke-width="1.5" opacity=".45"/>

  <!-- Decorative corner marks -->
  <g fill="none" stroke="#a62b4b" stroke-width="3" opacity=".8">
    <path d="M108 130 L108 102 L136 102"/>
    <path d="M404 130 L404 102 L376 102"/>
    <path d="M108 382 L108 410 L136 410"/>
    <path d="M404 382 L404 410 L376 410"/>
  </g>

  <!-- Shadow heart -->
  <path d="M256 356
           C226 329 150 274 150 210
           C150 167 178 143 211 143
           C233 143 250 155 256 176
           C262 155 279 143 301 143
           C334 143 362 167 362 210
           C362 274 286 329 256 356 Z"
        fill="#e0003d" opacity=".32" filter="url(#softGlow)"/>

  <!-- Main heart -->
  <path d="M256 350
           C226 323 150 268 150 204
           C150 161 178 137 211 137
           C233 137 250 149 256 170
           C262 149 279 137 301 137
           C334 137 362 161 362 204
           C362 268 286 323 256 350 Z"
        fill="url(#red)" stroke="#ff5479" stroke-width="2.5"/>

  <!-- Angular inner highlight -->
  <path d="M174 202
           C174 174 191 158 213 158
           C229 158 241 168 249 185"
        fill="none" stroke="#ff9caf" stroke-width="4"
        stroke-linecap="round" opacity=".75"/>

  <!-- Heartbeat -->
  <path d="M163 244 H213 L236 211 L266 281
           L294 230 L315 244 H349"
        fill="none" stroke="#ff244f" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"
        opacity=".55" filter="url(#glow)"/>

  <path d="M163 244 H213 L236 211 L266 281
           L294 230 L315 244 H349"
        fill="none" stroke="url(#silver)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small crimson highlights -->
  <circle cx="163" cy="244" r="5" fill="#fff1f5"/>
  <circle cx="349" cy="244" r="5" fill="#fff1f5"/>

  <!-- Bottom gothic diamond -->
  <path d="M256 374 L269 392 L256 410 L243 392 Z"
        fill="url(#red)" stroke="#ff5979" stroke-width="1.5"/>

  <path d="M256 382 V402 M246 392 H266"
        stroke="#ffe7ed" stroke-width="2" opacity=".8"/>

  <!-- Subtle top ornament -->
  <path d="M245 91 L256 76 L267 91 L256 106 Z"
        fill="none" stroke="#d83b5e" stroke-width="2"/>
  <circle cx="256" cy="91" r="3" fill="#ff5479"/>
</svg>
