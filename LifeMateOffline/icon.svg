
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19070c"/>
      <stop offset="55%" stop-color="#080609"/>
      <stop offset="100%" stop-color="#26040d"/>
    </linearGradient>

    <linearGradient id="heart" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ff3154"/>
      <stop offset="45%" stop-color="#a50829"/>
      <stop offset="100%" stop-color="#3b0614"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4e9"/>
      <stop offset="35%" stop-color="#b6a0a8"/>
      <stop offset="70%" stop-color="#5b414b"/>
      <stop offset="100%" stop-color="#f04462"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ff1744" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#background)"/>

  <!-- Crimson ambient glow -->
  <circle cx="256" cy="250" r="205" fill="url(#glow)"/>

  <!-- Outer gothic frame -->
  <path
    d="M256 55 L278 81 L309 67 L318 99 L352 99 L351 132
       L383 143 L367 174 L393 197 L367 222 L383 252
       L352 267 L357 301 L325 310 L316 343 L286 335
       L256 369 L226 335 L196 343 L187 310 L155 301
       L160 267 L129 252 L145 222 L119 197 L145 174
       L129 143 L161 132 L160 99 L194 99 L203 67
       L234 81 Z"
    fill="none"
    stroke="#6d172b"
    stroke-width="2"
    opacity=".75"
  />

  <!-- Shadow beneath the emblem -->
  <path
    d="M256 385 C222 352 133 292 133 215
       C133 160 194 135 238 181 L256 201
       L274 181 C318 135 379 160 379 215
       C379 292 290 352 256 385 Z"
    fill="#ff1744"
    opacity=".35"
    filter="url(#shadow)"
  />

  <!-- Sharp heart emblem -->
  <path
    d="M256 365
       L231 337
       L201 322
       L178 295
       L157 264
       L145 231
       L147 202
       L160 179
       L181 165
       L207 164
       L230 176
       L256 205
       L282 176
       L305 164
       L331 165
       L352 179
       L365 202
       L367 231
       L355 264
       L334 295
       L311 322
       L281 337 Z"
    fill="url(#heart)"
    stroke="#ff4567"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Inner dark heart facet -->
  <path
    d="M256 339
       L235 315
       L212 302
       L191 276
       L174 248
       L168 222
       L175 198
       L194 185
       L214 188
       L238 210
       L256 233
       L274 210
       L298 188
       L318 185
       L337 198
       L344 222
       L338 248
       L321 276
       L300 302
       L277 315 Z"
    fill="#210710"
    opacity=".7"
  />

  <!-- Metallic pulse line -->
  <path
    d="M174 252
       L216 252
       L237 222
       L260 282
       L285 235
       L300 252
       L338 252"
    fill="none"
    stroke="#0b0709"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M174 252
       L216 252
       L237 222
       L260 282
       L285 235
       L300 252
       L338 252"
    fill="none"
    stroke="url(#metal)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Small sharp accent -->
  <path
    d="M256 205 L248 238 L256 231 L264 238 Z"
    fill="#ffdce3"
    opacity=".9"
  />

  <!-- Bottom signature diamond -->
  <path
    d="M256 393 L267 405 L256 417 L245 405 Z"
    fill="#e52248"
  />

  <!-- Subtle edge highlights -->
  <path
    d="M181 165 L207 164 L230 176"
    fill="none"
    stroke="#ff9aaa"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".8"
  />

  <path
    d="M282 176 L305 164 L331 165"
    fill="none"
    stroke="#ff9aaa"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".8"
  />

  <!-- Border -->
  <rect
    x="9" y="9" width="494" height="494" rx="105"
    fill="none"
    stroke="#772033"
    stroke-width="2"
    opacity=".7"
  />
</svg>
